[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperengine"
version = "1.6.1"
description = "Pre-submission rejection-risk engine for academic manuscripts (65 check engines, dual international/Indian standards, CLI + local web GUI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PaperCheck contributors" }]
keywords = [
    "academic", "publishing", "peer-review", "manuscript", "rejection",
    "plagiarism", "research-integrity", "UGC", "IEEE", "journal",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
images = ["Pillow>=10.0"]
all = ["pypdf>=4.0", "Pillow>=10.0"]

[project.scripts]
papercheck = "papercheck.__main__:main"

[tool.setuptools.packages.find]
include = ["papercheck*"]
